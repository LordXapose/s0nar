[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "s0nar"
version = "1.0.0"
description = "Full-spectrum subdomain reconnaissance"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LordXapose" }]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "aiohttp>=3.9.0",
    "dnspython>=2.4.0",
    "python-nmap>=0.7.1",
    "requests>=2.31.0",
]

[project.urls]
Homepage   = "https://github.com/LordXapose/s0nar"
Repository = "https://github.com/LordXapose/s0nar"
Issues     = "https://github.com/LordXapose/s0nar/issues"

[project.scripts]
s0nar = "s0nar.main:app"
sonar = "s0nar.main:app"

[tool.setuptools.packages.find]
include = ["s0nar*"]

[tool.ruff]
line-length = 100
target-version = "py39"